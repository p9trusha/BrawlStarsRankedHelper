<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Помощник рангового боя Brawl Stars</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>

<body>
  <header>
    <h1>Помощник рангового боя Brawl Stars</h1>
    <p>Рекомендация бойца по карте на основе ранговых винрейтов (выбор лиги: Diamond I+ / Mythic I+ / Mythic III+ /
      Legendary I+, данные Brawl Planet)</p>
  </header>

  <main>
    <section class="panel">
      <h2>1. Твой аккаунт</h2>
      <div class="row">
        <input type="text" id="tagInput" placeholder="Тег игрока, например #2PR8J29GL" />
        <button id="loadBtn">Загрузить бойцов</button>
      </div>
      <div id="playerInfo"></div>
    </section>

    <section class="panel">
      <h2>2. Карта из текущей ротации ранга</h2>
      <div class="tier-row">
        <span class="muted">Ранговая лига:</span>
        <div id="tierDropdown"></div>
      </div>
      <input type="text" id="mapSearch" placeholder="Поиск карты..." />
      <div id="mapGrid" class="loading">Загружаю карты...</div>
    </section>

    <section class="panel" id="recPanel" hidden>
      <h2 id="recTitle">Рекомендация</h2>
      <div class="tabs">
        <button type="button" class="tab-btn active" data-mode="ban">Бан</button>
        <button type="button" class="tab-btn" data-mode="pick">Пик</button>
      </div>
      <div id="recBody"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>

</html>
