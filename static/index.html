<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Помощник рангового боя Brawl Stars</title>
  <style>
    :root {
      --bg: #0f1220;
      --panel: #181c30;
      --panel2: #20253f;
      --border: #2d3450;
      --text: #e6e9f5;
      --muted: #9aa2c0;
      --accent: #f7b32b;
      --good: #4ade80;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #1c2240, #0f1220);
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 16px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    input[type="text"] {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      flex: 1;
      min-width: 220px;
    }
    button {
      background: var(--accent);
      color: #1a1a1a;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: .5; cursor: default; }
    .muted { color: var(--muted); font-size: 13px; }
    .error { color: var(--bad); font-size: 13px; margin-top: 8px; }
    .ok { color: var(--good); font-size: 13px; margin-top: 8px; }
    #mapGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .map-card {
      background: var(--panel2);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      transition: border-color .15s;
    }
    .map-card:hover { border-color: var(--accent); }
    .map-card.active { border-color: var(--accent); background: #2b2f4d; }
    .map-card img.map-img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 6px;
      background: #111;
    }
    .map-card .map-name { font-size: 13px; font-weight: 600; margin-top: 6px; }
    .map-card .map-mode { font-size: 11px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    td.num, th.num { text-align: right; }
    .brawler-cell { display: flex; align-items: center; gap: 10px; }
    .brawler-cell img { width: 36px; height: 36px; border-radius: 6px; background: #111; }
    .rank-badge { color: var(--muted); font-size: 12px; margin-right: 6px; }
    .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
    label.check { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-top: 8px; cursor: pointer; }
    select {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
    }
    .tier-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .loading { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .empty { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .pill { background: var(--panel2); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
    .pill b { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>Помощник рангового боя Brawl Stars</h1>
    <p>Рекомендация бойца по карте на основе ранговых винрейтов (выбор лиги: Diamond I+ / Mythic I+ / Mythic III+ / Legendary I+, данные Brawl Planet)</p>
  </header>

  <main>
    <section class="panel">
      <h2>1. Твой аккаунт</h2>
      <div class="row">
        <input type="text" id="tagInput" placeholder="Тег игрока, например #8L2P9Q" />
        <button id="loadBtn">Загрузить бойцов</button>
      </div>
      <div id="playerInfo"></div>
    </section>

    <section class="panel">
      <h2>2. Карта из текущей ротации ранга</h2>
      <div class="tier-row">
        <label class="muted" for="tierSelect">Ранговая лига:</label>
        <select id="tierSelect">
          <option value="pl" selected>Diamond I+</option>
          <option value="pl-m1">Mythic I+</option>
          <option value="pl-m3">Mythic III+</option>
          <option value="pl-l1">Legendary I+</option>
        </select>
      </div>
      <input type="text" id="mapSearch" placeholder="Поиск карты..." />
      <div id="mapGrid" class="loading">Загружаю карты...</div>
    </section>

    <section class="panel" id="recPanel" hidden>
      <h2 id="recTitle">Рекомендация</h2>
      <div id="recBody"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
